name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # GitHub Release বানানোর জন্য দরকার

env:
  # ভার্সন নাম হবে <MAJOR_VERSION>.<রান নম্বর>, যেমন 1.1, 1.2, 1.3...
  # ভার্সন কোড = রান নম্বর (প্রথম রানে 1)
  MAJOR_VERSION: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # কীস্টোর সেটআপ (অটো): সাইনিংয়ের কী নেওয়ার ক্রম:
      # ১) GitHub Secrets দেওয়া থাকলে সেটা
      # ২) না থাকলে রিপোর signing/hisab-release.jks (স্থায়ী কী, প্রতিবার একই, আপডেট ইনস্টল হবে)
      # ৩) কোনোটাই না থাকলে অস্থায়ী কী (এই APK-র উপর আপডেট ইনস্টল হবে না)
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          elif [ -f signing/hisab-release.jks ]; then
            echo "স্থায়ী কীস্টোর (signing/hisab-release.jks) দিয়ে সাইন করা হচ্ছে"
            cp signing/hisab-release.jks "$KS"
            echo "KEYSTORE_PASSWORD=hisab-Key-2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hisab" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=hisab-Key-2026" >> "$GITHUB_ENV"
          else
            echo "::warning::স্থায়ী কীস্টোর পাওয়া যায়নি। অস্থায়ী কীস্টোর দিয়ে সাইন করা হচ্ছে।"
            keytool -genkeypair -v -keystore "$KS" -alias hisab -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass hisabtemp123 -keypass hisabtemp123 \
              -dname "CN=Hisab, OU=Dev, O=Hisab, C=BD"
            echo "KEYSTORE_PASSWORD=hisabtemp123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=hisab" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=hisabtemp123" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=${{ env.MAJOR_VERSION }}.${{ github.run_number }} 2>&1 | tee build.log

      # বিল্ড ফেইল করলে Kotlin এরর (e: ...) লাইনগুলো রানের Summary পাতায় দেখাবে
      - name: Show build errors
        if: failure()
        run: |
          {
            echo '### বিল্ড এরর'
            echo '```'
            grep -E '^e: |^w: .*error|What went wrong' -A2 build.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: ' build.log || true

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "hisab-v${{ env.MAJOR_VERSION }}.${{ github.run_number }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisab-v${{ env.MAJOR_VERSION }}.${{ github.run_number }}
          path: hisab-v*.apk
          if-no-files-found: error

      # Releases পাতায় APK দেওয়া হয়: ট্যাগ v1.<রান নম্বর>, যেমন v1.12
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ env.MAJOR_VERSION }}.${{ github.run_number }}"
          gh release create "v$VER" "hisab-v$VER.apk" \
            --title "আমার হিসাব v$VER" \
            --notes "বিল্ড #${{ github.run_number }} | কমিট ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA" \
            --latest
