name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write   # keystore সেভ ও Release তৈরির জন্য

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure release.keystore exists
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v \
              -keystore release.keystore \
              -storepass hisab123456 \
              -alias hisabkey \
              -keypass hisab123456 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Hisab,O=Hisab,C=BD"
            echo "NEW_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Save keystore to repository (first time only)
        if: env.NEW_KEYSTORE == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f release.keystore
          git commit -m "Add release keystore [skip ci]"
          git push

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hisab-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "hisab-v${VER}.apk"
          gh release create "v${VER}" "hisab-v${VER}.apk" \
            --target "${{ github.sha }}" \
            --title "v${VER}" \
            --notes "Release build ${VER}"
